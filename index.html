<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hakim Login</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.2)),
    linear-gradient(135deg,#0066a1,#12b6d9);
    overflow:hidden;
    position:relative;
}



body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background-image:
    radial-gradient(rgba(255,255,255,.08) 2px, transparent 2px);
    background-size:60px 60px;
    opacity:.4;
}



.login-box{
    width:420px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(15px);
    border-radius:30px;
    padding:40px 35px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    position:relative;
    z-index:1;
    text-align:center;
    color:white;
}



.logo img{
    width:140px;
    margin-bottom:15px;
}

.logo h1{
    font-size:50px;
    margin-bottom:10px;
    color:white;
}

.logo p{
    font-size:16px;
    opacity:.9;
    margin-bottom:30px;
}



.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:16px 50px 16px 16px;
    border:none;
    outline:none;
    border-radius:15px;
    background:white;
    font-size:16px;
}

.input-box i{
    position:absolute;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    color:#777;
    font-size:18px;
}



.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    font-size:14px;
}

.options a{
    color:white;
    text-decoration:none;
}

.options a:hover{
    text-decoration:underline;
}



.login-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:linear-gradient(90deg,#00b4db,#005c97);
    color:white;
    font-size:20px;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    transform:scale(1.03);
}



.footer{
    margin-top:25px;
    font-size:14px;
}

.footer a{
    color:white;
    font-weight:bold;
    text-decoration:none;
}

.footer a:hover{
    text-decoration:underline;
}
.logo img{
    width:140px;
    height:140px;
    border-radius:50%;
    object-fit:cover;
    background:white;
    padding:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    margin-bottom:15px;
}
 #drop-area {
            width: 300px;
            height: 150px;
            border: 2px dashed #999;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            text-align: center;
        }
</style>
</head>

<body>

    <div id="result"></div>

<div class="login-box">

    <div class="logo">

        
        <img src="hakeem.png" alt="Hakim Logo">

        <h1>حكيم</h1>
        <p>نظام إدارة العيادات والمراكز الطبية</p>
    </div>

    
<form onsubmit="return false;">
        <div class="input-box">
          <input type="text" id="username" placeholder="اسم المستخدم">
            <i class="fa-regular fa-user"></i>
        </div>

        <div class="input-box">
            <input type="password" id="password" placeholder="كلمة المرور">
            <i class="fa-solid fa-lock"></i>
        </div>

        <div class="options">
            <label>
                <input type="checkbox">
                تذكرني
            </label>

            <a href="#">نسيت كلمة المرور؟</a>
        </div>

       <button type="button" class="login-btn" onclick="login()">
    تسجيل الدخول
</button>

    </form>

    <div class="footer">
        جميع الحقوق محفوظة © حكيم 2024
    </div>

</div>


<script>
async function login(){

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    try {
        const response = await fetch("http://localhost:5000/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                password
            })
        });

        const data = await response.json();

        if(data.success){
            window.location.href = "home.html";
        }else{
            alert(data.message || "فشل تسجيل الدخول");
        }

    } catch (error) {
        console.log(error);
        alert("لا يوجد اتصال بالسيرفر");
    }
}
</script>

</body>
</html>
