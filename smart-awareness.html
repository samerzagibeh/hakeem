<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التوعية الذكية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cairo',sans-serif;
    background:linear-gradient(135deg,#f8fafc,#e2e8f0);
    min-height:100vh;
}

.container{
    width:90%;
    max-width:1000px;
    margin:auto;
    padding:40px 20px;
}

.header{
    text-align:center;
    margin-bottom:40px;
}

.header h1{
    color:#0f172a;
    font-size:42px;
    margin-bottom:15px;
}

.header p{
    color:#475569;
    font-size:18px;
    line-height:1.8;
}

.chat-box{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.messages{
    height:400px;
    overflow-y:auto;
    padding:15px;
    border-radius:15px;
    background:#f8fafc;
    margin-bottom:20px;
}

.bot-message{
    background:#e0f2fe;
    padding:15px;
    border-radius:15px;
    margin-bottom:10px;
    width:fit-content;
    max-width:80%;
}

.user-message{
    background:#2563eb;
    color:white;
    padding:15px;
    border-radius:15px;
    margin-right:auto;
    margin-bottom:10px;
    width:fit-content;
    max-width:80%;
}

.input-area{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:15px;
    border:1px solid #cbd5e1;
    border-radius:12px;
    font-size:16px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

.back-btn{
    display:inline-block;
    margin-top:25px;
    text-decoration:none;
    background:#0f172a;
    color:white;
    padding:12px 25px;
    border-radius:12px;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🧠 التوعية الذكية</h1>
        <p>
            اسأل أي سؤال متعلق بالمخدرات أو الإدمان
            وسيتم عرض معلومات توعوية للمساعدة.
        </p>
    </div>

    <div class="chat-box">

        <div class="messages" id="messages">
            <div class="bot-message">
                مرحباً، أنا مساعد التوعية الذكية. كيف أستطيع مساعدتك؟
            </div>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="userInput"
                placeholder="اكتب سؤالك هنا..."
            >
            <button onclick="sendMessage()">إرسال</button>
        </div>

    </div>

    <a href="wa3i.html" class="back-btn">
        العودة
    </a>

</div>

<script>

function sendMessage(){

    let input=document.getElementById("userInput");
    let messages=document.getElementById("messages");

    if(input.value.trim()==="") return;

    messages.innerHTML += `
        <div class="user-message">
            ${input.value}
        </div>
    `;

    messages.innerHTML += `
        <div class="bot-message">
            شكراً لسؤالك. يمكنك ربط هذه الصفحة مع Gemini API
            أو أي نموذج ذكاء اصطناعي للحصول على إجابات حقيقية.
        </div>
    `;

    input.value="";

    messages.scrollTop=messages.scrollHeight;
}

</script>

</body>
</html>
